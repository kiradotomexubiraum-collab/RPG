<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arquivo da ALC — Ficha de Campo</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("rpg_theme") || "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&family=IM+Fell+English:ital@0;1&family=MedievalSharp&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Adicionar a div para exibir as informações de login -->
  <div id="login-container">
    <button id="login-button">Iniciar Autenticação</button>
    <p id="verification-uri"></p>
    <p id="user-code"></p>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="github-api.js"></script>
  <!-- Adicionar o script index.js -->
  <script src="index.js"></script>
  <script src="app.js"></script>
</body>
</html>
